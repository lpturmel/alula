name: Release desktop app

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - id: version
        name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the stable vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "alula") | .version')"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not determine the alula package version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all -- --check

  macos:
    name: Build macOS ARM64
    needs: metadata
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Select stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test and build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]]
          # Integration tests make Cargo build the normal application binary too,
          # so this single release-profile build graph serves tests and packaging.
          cargo test --release --locked -p alula
          test -x target/release/alula
          file target/release/alula | grep -q arm64

      - name: Assemble app bundle
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          app="dist/Alula.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/alula "$app/Contents/MacOS/alula"
          cp crates/alula/assets/app-icon.icns "$app/Contents/Resources/Alula.icns"
          plutil -create xml1 "$app/Contents/Info.plist"
          plutil -insert CFBundleDisplayName -string Alula "$app/Contents/Info.plist"
          plutil -insert CFBundleExecutable -string alula "$app/Contents/Info.plist"
          plutil -insert CFBundleIconFile -string Alula "$app/Contents/Info.plist"
          plutil -insert CFBundleIdentifier -string dev.alula.app "$app/Contents/Info.plist"
          plutil -insert CFBundleName -string Alula "$app/Contents/Info.plist"
          plutil -insert CFBundlePackageType -string APPL "$app/Contents/Info.plist"
          plutil -insert CFBundleShortVersionString -string "$VERSION" "$app/Contents/Info.plist"
          plutil -insert CFBundleVersion -string "$VERSION" "$app/Contents/Info.plist"
          plutil -insert LSApplicationCategoryType -string public.app-category.developer-tools "$app/Contents/Info.plist"
          plutil -insert NSHighResolutionCapable -bool true "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"

      - name: Package and checksum
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive="Alula-${VERSION}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Alula.app "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            dist/Alula-*-macOS-arm64.zip
            dist/Alula-*-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows x64
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test and build release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Integration tests build the normal binary in the same release graph.
          cargo test --release --locked -p alula
          if (-not (Test-Path target/release/alula.exe -PathType Leaf)) {
            throw "cargo test did not produce target/release/alula.exe"
          }

      - name: Package and checksum
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "Alula-$env:VERSION-Windows-x86_64.zip"
          $package = "dist/Alula"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item target/release/alula.exe "$package/Alula.exe"
          Copy-Item README.md "$package/README.md"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/$archive" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist/$archive.sha256" -NoNewline

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            dist/Alula-*-Windows-x86_64.zip
            dist/Alula-*-Windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [metadata, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload native builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected two archives and two checksums; found ${#assets[@]} files" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "Alula $RELEASE_TAG" \
              --generate-notes
          fi
