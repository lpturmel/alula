[package]
name = "alula"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "alula"

[dependencies]
anyhow = "1"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
lsp-types = "0.97"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "charset", "cookies", "http2", "json", "rustls-no-provider", "system-proxy"] }
ropey = "2.0.0-beta.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde-transcode = "1"
smol = "2"
tree-sitter-css = "0.23.2"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.23.1"
toml = "0.8"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
