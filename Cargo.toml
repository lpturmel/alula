[workspace]
members = ["crates/alula"]
exclude = ["vendor/gpui-component", "vendor/xim-ctext"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.2"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
# zed-xim negotiates COMPOUND_TEXT on Linux. The published decoder rejects
# valid unescaped Latin-1 input (for example 0xE9) and zed-xim then panics.
xim-ctext = { path = "vendor/xim-ctext" }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
# Keep profiling builds quick to iterate and easy to symbolize. Production
# distributions use the more expensive whole-program settings above.
lto = false
codegen-units = 16
