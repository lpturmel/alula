[workspace]
members = ["crates/alula"]
exclude = ["vendor/gpui-component", "vendor/xim-ctext"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.1"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
# zed-xim negotiates COMPOUND_TEXT on Linux. The published decoder rejects
# valid unescaped Latin-1 input (for example 0xE9) and zed-xim then panics.
xim-ctext = { path = "vendor/xim-ctext" }

[profile.release]
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
