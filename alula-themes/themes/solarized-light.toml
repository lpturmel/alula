editor_foreground = "#657b83"
comment = "#93a1a1"
keyword = "#859900"
string = "#2aa198"
number = "#d33682"
function = "#268bd2"
type_color = "#b58900"
variable = "#657b83"
property = "#2aa198"
tag = "#268bd2"
attribute = "#b58900"
